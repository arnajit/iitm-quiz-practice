    try { vals.push(JSON.parse(await f.text())); } catch(e){ bad.push(f.name); }
  }
  if (bad.length && !vals.length){ im.status = `Couldn’t read ${bad.join(", ")} as JSON.`; im.err = true; render(); return; }
  ingestJson(vals, bad);
}
async function ingestJson(vals, bad){
  const im = S.imp; const all = []; const notes = [];
  for (const v of vals){
    const portal = portalExtractAll(v);
    if (portal.length){
      for (const a of portal){ all.push(...a.questions); if (a.skipped) notes.push(`${a.title || "Assignment"}: ${a.skipped} text-answer question${a.skipped===1?"":"s"} skipped`); }
      continue;
    }
    if (v && v.log) { notes.push("That HAR file had no assignment responses in it."); continue; }
    if (v && v.figures && typeof v.figures === "object") await absorbFigures(v.figures);
    const arr = Array.isArray(v) ? v : (v && v.questions) || [];
    if (!Array.isArray(v) && v && v.name && im.target === "__new" && !im.newName) im.newName = v.name;
    all.push(...arr);
  }
  await internalizeFigures(all);
  setPreview(all);
  const extra = (notes.length ? " " + notes.join("; ") + "." : "") + (bad && bad.length ? ` Couldn’t read ${bad.join(", ")}.` : "");
  if (extra){ im.status = (im.status + extra).trim(); render(); }
}
function setPreview(arr){
  const im = S.imp;
  const qs = []; let bad = 0;
  for (const raw of arr){ const q = validQ(raw); q ? qs.push(q) : bad++; }
  const core = q => typeOf(q) + "|" + norm(q.text) + "|" + (q.options||[]).map(optNorm).join("#");
  const existing = new Map();
  if (im.target !== "__new" && S.banks[im.target]) for (const q of S.banks[im.target].questions) existing.set(core(q), q);
  const seen = new Set(); let dup = 0; const updates = [];
  const fresh = qs.filter(q => {
    const f = core(q);
    if (seen.has(f)) return false;
    seen.add(f);
    const old = existing.get(f);
    if (!old) return true;
    const gainsImg = (q.images || []).some(u => !(old.images || []).includes(u)) || (q.passageImages || []).some(u => !(old.passageImages || []).includes(u));
    const gainsOptImg = !!q.optionImages && JSON.stringify(q.optionImages) !== JSON.stringify(old.optionImages || null);
    const gainsPassage = (q.passage && q.passage !== old.passage) || (!!q.imagesBelow !== !!old.imagesBelow && !!q.images) || ((q.textAfter || "") !== (old.textAfter || "") && !!q.images);
    const gainsKey = !hasKey(old) && hasKey(q);
    if (gainsImg || gainsOptImg || gainsPassage || gainsKey) updates.push({ old, q });
    else dup++;
    return false;
  });
  im.preview = fresh; im.updates = updates;
  im.err = !fresh.length && !updates.length;
  im.status = (dup ? `${dup} question${dup===1?" is":"s are"} already in this subject and won’t be added again.` : "") + (bad ? ` ${bad} couldn’t be used.` : "");
  render();
  setTimeout(()=>{ const p = document.getElementById("preview"); if (p) p.scrollIntoView({ behavior:"smooth", block:"start" }); }, 50);
}
function previewPanel(){
  const im = S.imp; const qs = im.preview;
  const existing = im.target !== "__new" && S.banks[im.target] ? S.banks[im.target] : null;
  const weeks = [...new Set(qs.map(weekName))].sort(weekSort);
  const unnamed = weeks.includes("");
  const weekIn = unnamed ? h("input", { type:"text", value: im.group, placeholder:"e.g. Week 7", "aria-label":"Week for questions without one", oninput:e=>{ im.group = e.target.value; } }) : null;
  const keyless = qs.filter(q=>!hasKey(q)).length;
  const target = existing ? existing.name : (im.newName.trim() || "the new subject");
  const panel = h("div", { class:"panel stack", id:"preview" },
    h("div", { class:"row" }, h("h2", null, qs.length ? `3. Add ${qs.length} question${qs.length===1?"":"s"}` : "3. Update existing questions"), h("span", { class:"spacer" }),
      h("label", { class:"check small" }, h("input", { type:"checkbox", checked: !!im.showKeys, onchange:e=>{ im.showKeys = e.target.checked; render(); } }), "Show answers")),
    unnamed ? h("label", { class:"field" }, h("span", null, "Which week are the unlabelled ones?"), weekIn) : null,
    keyless ? h("p", { class:"small muted" }, `${keyless} ha${keyless===1?"s":"ve"} no answer key. During practice you can save your answer as the key.`) : null,
    im.updates && im.updates.length ? h("p", { class:"note" }, `${im.updates.length} question${im.updates.length===1?"":"s"} you already have will get the shared paragraph, figure or answer key that was missing.`) : null);
  if (im.updates && im.updates.length){
    const ul = h("ul", { class:"qcards" });
    im.updates.forEach((u, i) => ul.append(qCard(u.q, i+1, !!im.showKeys, null)));
    panel.append(h("details", { class:"pv-week" }, h("summary", null, h("strong", null, "Updated questions"), h("span", { class:"small muted" }, ` ${im.updates.length}, shown as they’ll look`)), ul));
  }
  const blocks = [];
  for (const w of weeks) for (const t of typesOf(qs.filter(q => weekName(q) === w))) blocks.push({ w, t: t.name });
  for (const { w, t } of blocks){
    const fresh = qs.filter(q => weekName(q) === w && typeOf(q) === t);
    const already = existing ? existing.questions.filter(q => weekName(q) === w && typeOf(q) === t) : [];
    const list = h("ul", { class:"qcards" });
    fresh.forEach((q, i) => list.append(qCard(q, already.length + i + 1, !!im.showKeys, () => { im.preview = qs.filter(x => x !== q); render(); })));
    const block = h("details", { class:"pv-week", open:true },
      h("summary", null, h("strong", null, w || "Week not in the file"), t !== "General" ? h("span", { class:"tpill " + t }, typeLabel(t)) : null,
        h("span", { class:"small muted" }, ` ${fresh.length} new` + (already.length ? `, joining ${already.length} already there` : ""))));
    if (already.length){
      const old = h("ul", { class:"qcards" });
      already.forEach((q, i) => old.append(qCard(q, i+1, !!im.showKeys, null)));
      block.append(h("details", { class:"pv-old" }, h("summary", { class:"small" }, `Show the ${already.length} already in ${w || NO_WEEK}` + (t !== "General" ? ` (${t.toLowerCase()})` : "")), old));
    }
    block.append(list);
    panel.append(block);
  }
  panel.append(h("div", { class:"row" },
    h("button", { class:"btn primary", disabled: !qs.length && !(im.updates && im.updates.length), onclick:commitImport }, qs.length ? `Add to ${target}` : "Update questions"),
    h("button", { class:"btn ghost", onclick:()=>{ im.preview = null; im.status = ""; render(); } }, "Discard")));
  return panel;
}
function commitImport(){
  const im = S.imp; const qs = im.preview || []; const ups = im.updates || []; if (!qs.length && !ups.length) return;
  let b;
  if (im.target === "__new"){
    const name = im.newName.trim();
    if (!name){ im.status = "Give the new subject a name first."; im.err = true; render(); return; }
    let id = "bank_" + slug(name); if (S.banks[id]) id += "-" + uid().slice(0,4);
    b = { id, kind:"bank", name, questions:[], createdAt: Date.now() };
  } else b = S.banks[im.target];
  const group = im.group.trim();
  const now = Date.now();
  for (const q of qs){ if (group && !q.group) q.group = group; q.addedAt = now; b.questions.push(q); }
  for (const { old, q } of ups){
    if (q.optionImages){
      const moved = new Set(q.optionImages.flat());
      old.optionImages = q.optionImages; old.options = q.options.slice();
      if (old.images) old.images = old.images.filter(u => !moved.has(u));
    }
    if (q.passageImages){ old.passageImages = q.passageImages.slice(); if (old.images) old.images = old.images.filter(u => !q.passageImages.includes(u)); }
    if (q.images && q.images.length) old.images = [...new Set([...(q.images), ...(old.images || [])])];
    if (old.images && !old.images.length) delete old.images;
    if (q.passage) old.passage = q.passage;
    if (q.images){ if (q.imagesBelow) old.imagesBelow = true; else delete old.imagesBelow; if (q.textAfter) old.textAfter = q.textAfter; else delete old.textAfter; }
    if (q.set && !old.set){ old.set = q.set; old.seq = q.seq; }
    if (!hasKey(old) && hasKey(q)){ old.answer = q.answer; old.type = q.type; if (q.tolerance != null) old.tolerance = q.tolerance; }
  }
  im.updates = [];
  store.saveBank(b);
  im.target = b.id; im.newName = ""; im.preview = null; im.json = "";
  im.status = (qs.length ? `Added ${qs.length} question${qs.length===1?"":"s"} to ${b.name}. ` : "") + (ups.length ? `Updated ${ups.length} existing question${ups.length===1?"":"s"}. ` : "") + "Open Subjects → Manage to see them with the rest."; im.err = false; im.group = "";
  S.openWeeks = S.openWeeks || new Set(); for (const q of qs) S.openWeeks.add(b.id + "::" + weekName(q));
  render();
}

/* ---------- boot ---------- */
if (inPreview){
  const bar = document.createElement("p");
  bar.className = "note"; bar.style.marginBottom = "1rem";
  bar.textContent = "You’re viewing Drill inside a preview window. Figures from the portal won’t load and your data may not be kept here. Download drill.html and open it directly in Chrome for the full app.";
  document.querySelector(".wrap").insertBefore(bar, document.getElementById("app"));
}
store.init();
})();
</script>
