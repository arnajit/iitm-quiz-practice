<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drill — practice without peeking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>
<style>
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E2E7EF; --ink:#18202C; --muted:#5A6577; --line:#CBD3DF;
  --pen:#2547A8; --pen-soft:#DCE4FA; --mark:#F3D54A; --ok:#227A49; --ok-soft:#DDF1E4; --bad:#B23A28; --bad-soft:#F8E0DB;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121722; --surface:#1B2230; --sunk:#242D3D; --ink:#E6EAF1; --muted:#9AA5B8; --line:#344055;
    --pen:#93AEFF; --pen-soft:#25345C; --mark:#E8C93A; --ok:#5CCB8B; --ok-soft:#173A28; --bad:#F08A76; --bad-soft:#47221C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1B2230; --sunk:#242D3D; --ink:#E6EAF1; --muted:#9AA5B8; --line:#344055;
  --pen:#93AEFF; --pen-soft:#25345C; --mark:#E8C93A; --ok:#5CCB8B; --ok-soft:#173A28; --bad:#F08A76; --bad-soft:#47221C;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.wrap{max-width:46rem;margin:0 auto;padding:1.25rem 1rem 4rem}
header.top{display:flex;align-items:center;gap:1rem;justify-content:space-between;padding:.25rem 0 1.25rem;flex-wrap:wrap}
.brand{font:800 1.6rem/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:.5rem;background:none;border:0;padding:0;cursor:pointer}
.brand .dot{width:1.05rem;height:1.05rem;border-radius:50%;border:2.5px solid var(--ink);background:var(--mark);display:inline-block}
nav.tabs{display:flex;gap:.25rem}
.tab{border:0;background:none;padding:.45rem .8rem;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);line-height:1.1;font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:.5rem 0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem}
.stack>*+*{margin-top:1rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1.5px solid var(--line);background:var(--surface);padding:.55rem 1rem;border-radius:10px;cursor:pointer;font-weight:700;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pen);border-color:var(--pen);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.field{display:block;font-weight:700;font-size:.9rem}
label.field>span{display:block;margin-bottom:.3rem}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:9px;padding:.5rem .65rem}
textarea{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;line-height:1.45;min-height:12rem;resize:vertical}
.check{display:flex;gap:.55rem;align-items:flex-start;cursor:pointer;padding:.2rem 0}
.check input{margin-top:.3rem;accent-color:var(--pen);width:1rem;height:1rem}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:.4rem .75rem;border-radius:8px;cursor:pointer;font-weight:700;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}

/* library */
.hero{padding:.5rem 0 1.5rem}
.hero p{max-width:36rem}
.bank{display:grid;grid-template-columns:1fr auto;gap:.4rem 1rem;align-items:center}
.bank+.bank{margin-top:.75rem}
.bank .meta{font-size:.88rem;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:.45rem;max-width:14rem}
.meter i{display:block;height:100%;background:var(--ok)}
.empty{text-align:center;padding:2.2rem 1rem;border:2px dashed var(--line);border-radius:14px}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:.5rem 1rem;margin-bottom:.4rem;flex-wrap:wrap}
.qnum{font:800 1.05rem var(--display)}
.progress{height:4px;background:var(--sunk);border-radius:2px;margin-bottom:1.2rem;overflow:hidden}
.progress i{display:block;height:100%;background:var(--pen);transition:width .25s}
.passage{background:var(--sunk);border-radius:10px;padding:.8rem 1rem;margin-bottom:1rem;font-size:.96rem;white-space:pre-wrap}
.passage summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:.85rem}
.qimgs{display:grid;gap:.6rem;margin-bottom:1rem}
.fig img{max-width:100%;height:auto;border-radius:8px;display:block}
.fig-err.over{border-color:var(--pen);background:var(--pen-soft)}
.fig-err:focus{outline:3px solid var(--pen);outline-offset:2px}
.fig-steps{margin:.4rem 0 .3rem;padding-left:1.2rem}
.fig-err{cursor:pointer;font-size:.85rem;color:var(--muted);border:1.5px dashed var(--line);border-radius:8px;padding:.6rem .8rem}
.fig-mini{font-size:.85rem;color:var(--muted)}
.fig-err a{color:var(--pen);font-weight:700}
.fig-src{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;overflow-wrap:anywhere;margin-top:.3rem;opacity:.8}
.qimgs img{max-width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--line);justify-self:start}
.qtext{font-size:1.08rem;white-space:pre-wrap;margin-bottom:1.1rem}
.opts{display:grid;gap:.55rem}
.opt{display:flex;gap:.85rem;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.7rem .9rem;cursor:pointer;transition:border-color .12s}
.opt:hover:not([aria-disabled="true"]){border-color:var(--pen)}
.opt[aria-disabled="true"]{cursor:default}
.optimgs{display:grid;gap:.4rem;margin-top:.2rem}
.opt .txt{min-width:0;flex:1}
.optimgs .fig img,.qc-oimg .fig img{max-height:14rem;width:auto;max-width:100%;background:#fff}
.bubble{flex:none;width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:700 .85rem var(--display);color:var(--muted);margin-top:-.1rem;transition:background .12s,border-color .12s}
.opt.multi .bubble{border-radius:7px}
.opt[aria-checked="true"]{border-color:var(--pen);background:var(--pen-soft)}
.opt[aria-checked="true"] .bubble{background:var(--pen);border-color:var(--pen);color:var(--surface)}
.opt.is-right{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-right .bubble{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt .txt{padding-top:.1rem;white-space:pre-wrap}
.verdict{margin-top:1rem;border-radius:12px;padding:.85rem 1rem;border:1.5px solid}
.verdict.ok{border-color:var(--ok);background:var(--ok-soft)}
.verdict.bad{border-color:var(--bad);background:var(--bad-soft)}
.verdict.none{border-color:var(--line);background:var(--sunk)}
.verdict strong{font-family:var(--display)}
.qfoot{display:flex;gap:.6rem;margin-top:1.3rem;flex-wrap:wrap;align-items:center}
.palette{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:1.4rem}
.palette.top{margin:.55rem 0 1.1rem}
.palette button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.palette button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qnav{display:flex;align-items:center;gap:.4rem}
.navbtn{width:2.1rem;height:2.1rem;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font:700 1.2rem/1 var(--display);display:grid;place-items:center;padding:0 0 .12rem}
.navbtn:hover:not(:disabled){border-color:var(--pen);color:var(--pen)}
.navbtn:disabled{opacity:.35;cursor:default}
.trackbox .progress{margin:.4rem 0 0}
.trackline{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:baseline;justify-content:space-between;font-size:.88rem}
.legend{display:flex;flex-wrap:wrap;gap:.25rem .8rem;color:var(--muted);font-size:.78rem}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.dot{width:.7rem;height:.7rem;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:inline-block}
.dot.ok{background:var(--ok-soft);border-color:var(--ok)} .dot.bad{background:var(--bad-soft);border-color:var(--bad)} .dot.answered{background:var(--pen-soft);border-color:var(--pen)}
.palette button{width:2.1rem;height:2.1rem;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.8rem}
.palette button.answered{background:var(--pen-soft);border-color:var(--pen)}
.palette button.current{outline:2.5px solid var(--ink);outline-offset:1px}
.kbd{font-size:.8rem;color:var(--muted)}

/* results */
.score{font:800 clamp(3rem,12vw,5rem)/1 var(--display);letter-spacing:-.04em}
.score small{font-size:.35em;color:var(--muted);letter-spacing:0;font-weight:700}
.rev{border-left:4px solid var(--line);padding:.35rem 0 .35rem .9rem}
.rev.ok{border-color:var(--ok)} .rev.bad{border-color:var(--bad)}
.rev+.rev{margin-top:.9rem}
.rev .q{white-space:pre-wrap}

/* subjects */
.subject .subj-head{align-items:flex-start}
.weeks{list-style:none;margin:.9rem 0 0;padding:0}
.weeks li{display:grid;grid-template-columns:minmax(6rem,1fr) auto 5rem auto;gap:.8rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.weeks li:first-child{border-top:0}
#preview .weeks li{grid-template-columns:1fr auto}
.wname{font-weight:700}
.wtype{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.wacts{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
.typehead{display:flex;align-items:center;gap:.6rem;margin:1rem 0 .2rem;padding-top:.6rem;border-top:1px dashed var(--line)}
.typehead:first-child{border-top:0;padding-top:0;margin-top:.2rem}
.tpill{display:inline-block;font-size:.72rem;font-weight:700;padding:.05rem .45rem;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:.35rem;vertical-align:middle}
.tpill.Practice{background:var(--pen-soft);color:var(--pen)}
.wbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.wbar i{display:block;height:100%;background:var(--ok)}
.btn.small{padding:.35rem .75rem;font-size:.88rem}
.aibar{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.aibtn::before{content:"✦";margin-right:.35rem;color:var(--pen)}
.ainote a{color:var(--pen);font-weight:700}
.aiwrap{margin-top:.5rem}
.aimanual{flex-basis:100%}
.aitext{width:100%;min-height:8rem;font-size:16px;margin-top:.3rem}
.aipics{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:.35rem;margin-top:.1rem}
.qfoot .aibar{flex-basis:100%}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;padding-left:1.6rem;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .8rem;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--ink)}
details.panel>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:.4rem}
details.panel>summary::before{content:"›";display:inline-block;width:1rem;transition:transform .15s;color:var(--muted)}
details.panel[open]>summary::before{transform:rotate(90deg)}
@media (max-width:520px){ .weeks li{grid-template-columns:1fr auto auto} .wbar{display:none} }
/* browsing cards */
.qcards{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.6rem}
.qcard{border:1px solid var(--line);border-radius:10px;padding:.7rem .85rem;background:var(--bg)}
.qc-head{gap:.5rem;margin-bottom:.35rem}
.qc-text{white-space:pre-wrap;margin:.3rem 0 .5rem}
.qc-passage{font-size:.88rem;color:var(--muted);margin:.2rem 0}
.qc-passage summary{cursor:pointer;font-weight:700}
.qc-passage div{white-space:pre-wrap;margin-top:.3rem}
.qc-img{max-width:100%;height:auto;border-radius:6px;background:#fff;margin:.3rem 0;display:block}
.qc-opts{list-style:none;margin:0;padding:0;display:grid;gap:.25rem}
.qc-opts li{display:flex;gap:.55rem;align-items:baseline;padding:.2rem .4rem;border-radius:6px}
.qc-opts li.right{background:var(--ok-soft)}
.qc-l{font:700 .8rem var(--display);color:var(--muted);width:1.1rem;flex:none}
.qc-otext{min-width:0;flex:1}
.qc-oimg{display:grid;gap:.3rem;margin-top:.2rem}
.qc-ok{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--ok);white-space:nowrap}
.pv-week{border-top:1px solid var(--line);padding-top:.8rem}
.pv-week>summary,.pv-old>summary{cursor:pointer}
.pv-old{margin:.5rem 0 .2rem;padding-left:.8rem;border-left:3px solid var(--line)}
/* stats */
nav.tabs{flex-wrap:wrap}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:1rem}
.totals b{display:block;font:800 1.7rem/1.1 var(--display);letter-spacing:-.02em}
.totals span{font-size:.85rem;color:var(--muted)}
.chartbox{overflow-x:auto}
.trend{width:100%;min-width:20rem;height:auto;display:block}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend .axis{fill:var(--muted);font-size:10px;font-family:var(--body)}
.trend rect.hi{fill:var(--ok)} .trend rect.mid{fill:var(--mark)} .trend rect.lo{fill:var(--bad)}
.tablebox{overflow-x:auto}
table.wk{border-collapse:collapse;width:100%;font-size:.92rem;margin-top:.4rem}
table.wk th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:700;padding:.3rem .5rem;border-bottom:1px solid var(--line)}
table.wk td{padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
table.wk td:first-child{font-weight:700}
.pill{display:inline-block;padding:.05rem .55rem;border-radius:999px;font-weight:700;font-size:.85rem}
.pill.hi{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--sunk);color:var(--ink)} .pill.lo{background:var(--bad-soft);color:var(--bad)}
.hist{list-style:none;margin:.6rem 0 0;padding:0}
.histrow{display:grid;grid-template-columns:11rem 1fr auto 4.5rem;gap:.8rem;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:.6rem .2rem;cursor:pointer}
.hist li:first-child .histrow{border-top:0}
.histrow:hover{background:var(--sunk)}
.hdate{font-size:.88rem;color:var(--muted)}
.hwhat{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:620px){ .histrow{grid-template-columns:1fr auto} .hdate{grid-column:1/-1} }
.steps{margin:0;padding-left:1.3rem}
.steps li+li{margin-top:.4rem}
pre.code{max-height:18rem;overflow:auto;background:var(--sunk);border-radius:8px;padding:.8rem;font-size:.75rem;line-height:1.45;white-space:pre}
/* import */
.drop{border:2px dashed var(--line);border-radius:14px;padding:1.6rem 1rem;text-align:center;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--pen);background:var(--pen-soft)}
.thumbs{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.75rem}
.thumb{position:relative;width:96px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);cursor:pointer;font-size:.8rem;line-height:1}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}
.status.err{color:var(--bad)}
.qlist{list-style:none;margin:0;padding:0}
.qlist li{display:flex;gap:.75rem;align-items:flex-start;padding:.6rem 0;border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qlist .t{flex:1;min-width:0}
.qlist .t div{white-space:pre-wrap;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:.05rem .5rem;border-radius:999px;background:var(--sunk);color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--mark);padding-left:.7rem}
.hidden{display:none!important}
mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
@media (max-width:520px){ .bank{grid-template-columns:1fr} .wrap{padding-top:.75rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="brand" aria-label="Drill home"><span class="dot" aria-hidden="true"></span>Drill</button>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-go="library">Subjects</button>
      <button class="tab" data-go="setup">Practice</button>
      <button class="tab" data-go="stats">Stats</button>
      <button class="tab" data-go="import">Add questions</button>
      <button class="tab" data-go="sheet" aria-label="Google Sheet sync">Sheet</button>
    </nav>
  </header>
  <main id="app" aria-live="polite"><p class="muted">Loading your subjects…</p></main>
  <p class="small muted" id="storeNote" style="margin-top:2.5rem"></p>
  <p class="small muted" style="margin-top:.4rem;opacity:.7">Drill version 2026-11-26 · 13</p>
</div>

<script>
(() => {
"use strict";

/* ---------- tiny DOM helper (text only, never markup) ---------- */
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "text") e.textContent = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)){ if (k == null || k === false) continue; e.append(k instanceof Node ? k : document.createTextNode(String(k))); }
  return e;
}
const app = document.getElementById("app");
function typeset(el){
  const go = () => window.MathJax && MathJax.typesetPromise ? MathJax.typesetPromise([el]).catch(()=>{}) : null;
  if (window.MathJax && MathJax.typesetPromise) go();
  else { let n = 0; const t = setInterval(() => { if ((window.MathJax && MathJax.typesetPromise) || ++n > 40){ clearInterval(t); go(); } }, 150); }
}
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const slug = s => (s||"bank").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "bank";
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const LETTERS = "ABCDEFGHIJKLMNOP";
const norm = s => String(s||"").toLowerCase().replace(/\s+/g," ").trim();
// Options that only make sense in a fixed spot stay at the end when shuffling.
const ANCHOR = /^(all|none|both|neither)\b.*(above|these|of the|options)|^(information|data)\b.*(not|in)sufficient|^cannot be determined|^can(not|’t|'t) be (determined|decided|said)|not possible to (decide|determine|say|tell)|^insufficient|^he is indifferent|^indifferent|^both\b|^neither\b/i;
const FIXED_PAIR = /^(true|false|yes|no)$/i;

/* ---------- storage: claude db (synced, private to you) or this browser ---------- */
const store = {
  mode: null, db: null, coll: null, queues: {},
  async init(){
    let done = false;
    const fallback = () => { if (done) return; done = true; this.local(); };
    const timer = setTimeout(fallback, 10000);
    try {
      const [db, user] = await Promise.all([
        window.claude && claude.use ? claude.use("db") : null,
        window.claude && claude.use ? claude.use("user") : null
      ]);
      const id = db && user ? await user.id() : null;
      if (done) return;
      if (!db || !id){ clearTimeout(timer); fallback(); return; }
      this.db = db; this.coll = db.collection("data/users/" + id);
      this.coll.onSnapshot(snap => {
        if (!done){ done = true; clearTimeout(timer); this.mode = "db"; }
        const banks = {}, stats = {};
        for (const d of snap.docs){
          const v = d.data(); if (!v) continue;
          if (v.kind === "bank") banks[d.id] = Object.assign({}, v, { id: d.id });
          else if (v.kind === "stats") stats[v.bankId] = v;
          else if (v.kind === "history") S.history = v.list || [];
          else if (v.kind === "deleted") S.deleted = { banks: v.banks || {}, questions: v.questions || {}, sessions: v.sessions || {} };
        }
        S.banks = banks; S.stats = stats;
        onData();
      }, err => {
        if (!done){ clearTimeout(timer); fallback(); }
        else showNote("Sync stopped (" + err.code + "). Reload the page to reconnect.");
      });
    } catch(e){ clearTimeout(timer); fallback(); }
  },
  local(){
    this.mode = "local";
    try {
      const raw = localStorage.getItem("drill:v1");
      if (raw){ const v = JSON.parse(raw); S.banks = v.banks || {}; S.stats = v.stats || {}; S.history = v.history || []; if (v.deleted) S.deleted = v.deleted; }
    } catch(e){}
    onData();
  },
  persistLocal(){ try { localStorage.setItem("drill:v1", JSON.stringify({ banks:S.banks, stats:S.stats, history:S.history || [], deleted:S.deleted })); } catch(e){ showNote("Couldn’t save in this browser (storage full or blocked)."); } },
  // one write at a time per document; the latest pending value wins
  write(docId, value){
    if (this.mode !== "db"){ this.persistLocal(); return Promise.resolve(); }
    const q = this.queues[docId] || (this.queues[docId] = { running:false, next:undefined });
    q.next = value;
    if (q.running) return Promise.resolve();
    const run = async () => {
      q.running = true;
      while (q.next !== undefined){
        const v = q.next; q.next = undefined;
        try { v === null ? await this.coll.doc(docId).delete() : await this.coll.doc(docId).set(v); }
        catch(e){
          if (e && e.code === "quota_exceeded") showNote("Storage is full. Delete a subject or some weeks to make room.");
          else if (e && e.code === "invalid_argument") showNote("A subject got too large to save in one piece (over ~250 KB). Split it into two subjects.");
          else if (e && e.code === "unavailable"){ await new Promise(r=>setTimeout(r, 600+Math.random()*800)); if (q.next === undefined) q.next = v; }
        }
      }
      q.running = false;
    };
    return run();
  },
  saveBank(b){ b.updatedAt = Date.now(); S.banks[b.id] = b; const { id, ...body } = b; sheet.scheduleBackup(); return this.write(b.id, body); },
  deleteBank(id){ tombs().banks[id] = Date.now(); this.saveDeleted(); delete S.banks[id]; delete S.stats[id]; this.write(id, null); sheet.scheduleBackup(); return this.write("stats_" + id, null); },
  dropBank(id){ delete S.banks[id]; delete S.stats[id]; this.write(id, null); return this.write("stats_" + id, null); },   // applying a deletion made elsewhere
  saveDeleted(){ return this.write("deleted", Object.assign({ kind:"deleted" }, tombs())); },
  saveStats(bankId){ const s = S.stats[bankId]; if (s) return this.write("stats_" + bankId, s); },
  saveHistory(){ return this.write("history", { kind:"history", list: (S.history || []).slice(0, 120) }); },
};
function tombs(){ const d = S.deleted || (S.deleted = {}); d.banks = d.banks || {}; d.questions = d.questions || {}; d.sessions = d.sessions || {}; return d; }
function markQuestionsDeleted(bankId, qs){ const t = tombs(), now = Date.now(); for (const q of qs) t.questions[bankId + "::" + q.id] = now; store.saveDeleted(); }
const isDeletedQ = (bankId, q) => Math.max(tombs().questions[bankId + "::" + q.id] || 0, tombs().banks[bankId] || 0) > (q.addedAt || 0);
function showNote(t){ document.getElementById("storeNote").textContent = t; }
let firstData = true;
function onData(){
  if (firstData){
    firstData = false;
    sheet.flush();
    if (sheet.on) sheet.restore().then(st => { const r = mergeState(st); if ((r.addedQ || r.addedS || r.removedQ) && ["library","stats","setup","manage"].includes(S.view)) render(); }).catch(()=>{});
    showNote(store.mode === "db"
      ? "Your subjects are saved to your Claude account and stay private to you."
      : sheet.on ? "Saved in this browser and backed up to your Google Sheet." : "Saved in this browser only. Connect a Google Sheet (Sheet tab) or use Manage → Export backup.");
  }
  if (["library","manage","setup","stats"].includes(S.view) || (S.view === "import" && !S.imp.busy)) render();
}

/* ---------- portal (seek / Course Builder) import ---------- */
/* Converts a seek.onlinedegree.iitm.ac.in (Course Builder) assessment response,
   or a HAR file holding several of them, into Drill questions. */
function portalDecodeEntities(s){
  return s.replace(/&nbsp;/g," ").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'")
          .replace(/&#(\d+);/g,(_,n)=>String.fromCodePoint(+n)).replace(/&#x([0-9a-f]+);/gi,(_,n)=>String.fromCodePoint(parseInt(n,16))).replace(/&amp;/g,"&");
}
function portalHtml(html){
  const images = [];
  let s = String(html || "");
  // does the first picture come after some text? ("The figure below shows…")
  const firstImg = s.search(/<img\b/i);
  const after = firstImg > 0 && portalDecodeEntities(s.slice(0, firstImg).replace(/<[^>]+>/g, " ")).replace(/\s+/g, "").length > 0;
  const lastImgEnd = (() => { let m, end = -1; const re = /<img\b[^>]*>/gi; while ((m = re.exec(s))) end = m.index + m[0].length; return end; })();
  const tail = lastImgEnd > 0 ? s.slice(lastImgEnd) : "";
  // math: <gcb-math>..</gcb-math>, also tolerate a second opening tag used as the closer
  s = s.replace(/<gcb-math[^>]*>([\s\S]*?)<\/?gcb-math>/gi, (_, m) => " \\(" + portalDecodeEntities(m).replace(/<[^>]+>/g,"").replace(/\s+/g," ").replace(/\\mathscr\b/g, "\\mathcal").trim() + "\\) ");
  s = s.replace(/<img\b[^>]*>/gi, tag => {
    const attr = n => { const m = tag.match(new RegExp("\\b" + n + "\\s*=\\s*[\"']([^\"']+)[\"']", "i")); return m ? portalDecodeEntities(m[1]).trim() : ""; };
    let src = attr("src"); const dp = attr("data-path");
    if (/^\/\//.test(src)) src = "https:" + src;
    if (/^http:\/\//i.test(src)) src = "https://" + src.slice(7);
    if (!/^https:\/\//i.test(src) && dp) src = "https://storage.googleapis.com/" + dp.replace(/^\/+/, "");
    else if (!/^https:\/\//i.test(src) && src && !/^data:/i.test(src)) src = "https://seek.onlinedegree.iitm.ac.in/" + src.replace(/^\/+/, "");
    if (/^https:\/\//i.test(src) || /^data:image\//i.test(src)) images.push(src.replace(/\s+/g, ""));
    return "\n";
  });
  s = s.replace(/<br\s*\/?>/gi, "\n").replace(/<\/?(div|p|li|ul|ol|tr|table|h\d)\b[^>]*>/gi, "\n").replace(/<td\b[^>]*>/gi, " ").replace(/<[^>]+>/g, "");
  s = portalDecodeEntities(s).replace(/\t/g," ").replace(/[ \u00a0]+/g," ");
  s = s.split("\n").map(l => l.trim()).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  s = s.replace(/(\\\)) +([,.;:?!)])/g, "$1$2").replace(/ +(\\\))/g, "$1").replace(/(\\\() +/g, "$1").replace(/\( \\\(/g,"(\\(");
  let textAfter = "";
  if (images.length && tail){
    const t = portalHtml_plain(tail);
    if (t && s.endsWith(t) && t.length < s.length) textAfter = t;
  }
  return { text: s, images, after, textAfter };
}
function portalHtml_plain(html){
  // same text clean-up as portalHtml, without pictures
  let s = String(html || "");
  s = s.replace(/<gcb-math[^>]*>([\s\S]*?)<\/?gcb-math>/gi, (_, m) => " \\(" + portalDecodeEntities(m).replace(/<[^>]+>/g,"").replace(/\s+/g," ").replace(/\\mathscr\b/g, "\\mathcal").trim() + "\\) ");
  s = s.replace(/<img\b[^>]*>/gi, "\n").replace(/<br\s*\/?>/gi, "\n").replace(/<\/?(div|p|li|ul|ol|tr|table|h\d)\b[^>]*>/gi, "\n").replace(/<td\b[^>]*>/gi, " ").replace(/<[^>]+>/g, "");
  s = portalDecodeEntities(s).replace(/\t/g," ").replace(/[ \u00a0]+/g," ");
  s = s.split("\n").map(l => l.trim()).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  s = s.replace(/(\\\)) +([,.;:?!)])/g, "$1$2").replace(/ +(\\\))/g, "$1").replace(/(\\\() +/g, "$1").replace(/\( \\\(/g,"(\\(");
  return s;
}
function portalFindHtml(it){
  // content blocks name their HTML differently; take the likeliest field, else any HTML-looking string
  for (const k of ["html","content","text","value","body","description","introduction"]){
    const v = it[k];
    if (typeof v === "string" && v.trim()) return v;
    if (v && typeof v === "object" && typeof v.value === "string" && v.value.trim()) return v.value;
  }
  let found = "";
  const walk = (o, d) => { if (found || d > 4 || !o || typeof o !== "object") return;
    for (const v of Object.values(o)){ if (typeof v === "string" && /<(img|p|div|span|br)\b/i.test(v)){ found = v; return; } walk(v, d + 1); } };
  walk(it, 0);
  return found;
}
function isPortalAssessment(v){ return v && typeof v === "object" && Array.isArray(v.sections) && v.sections.some(s => s && (Array.isArray(s.items) || (s.kind === "question" && s.question))); }
function portalConvert(data){
  const title = String(data.title || "").trim();
  const wk = title.match(/^week\s*\d+/i);
  const group = wk ? wk[0].replace(/\s+/g," ").replace(/^week/i,"Week") : title;
  // Shared context can live in a section's introduction or in non-question
  // content items ("The information below is common to Questions 1 to 2").
  const raw = [];
  let ctxN = 0;
  const ctxFrom = html => { const c = portalHtml(html); return (c.text || c.images.length) ? { text: c.text.replace(/^paragraph\s+for\s+questions?\s*\d+\s*(?:[-–to]+\s*\d+)?\s*:?\s*/i, "").replace(/^(?:common\s+data|the\s+information\s+below)[^\n]{0,80}\n+/i, ""), images: c.images, id: "ctx-" + (++ctxN) } : null; };
  for (const sec of data.sections || []){
    // a question can sit directly in the list, outside any group
    if (sec && sec.kind === "question" && sec.question){ raw.push({ instance: sec.instance_id, q: sec.question, ctx: null }); continue; }
    let ctx = sec.introduction ? ctxFrom(typeof sec.introduction === "string" ? sec.introduction : (sec.introduction.value || "")) : null;
    for (const it of sec.items || []){
      if (it.kind === "question" && it.question){ raw.push({ instance: it.instance_id, q: it.question, ctx }); continue; }
      const html = portalFindHtml(it);
      if (html){ const c = ctxFrom(html); if (c) ctx = c; }
    }
  }
  const saved = data.saved_answers || {};
  const out = [];
  let skipped = 0;
  raw.forEach((r, i) => {
    const q = r.q;
    const p = portalHtml(q.prompt);
    let text = p.text, passage = "", header = null;
    const hm = text.match(/^paragraph\s+for\s+questions?\s*(\d+)\s*(?:[-–to]+\s*(\d+))?\s*:?\s*/i);
    if (hm){ header = { a: +hm[1], b: +(hm[2] || hm[1]) }; text = text.slice(hm[0].length).trim(); }
    const item = { id: "p" + (q.id || r.instance || i), group, images: p.images, source: title, assess: assessFromTitle(title) || undefined };
    if (p.after && p.images.length) item.imagesBelow = true;
    if (p.after && p.textAfter) item.textAfter = p.textAfter;
    if (header){
      const blocks = text.split(/\n\n+/);
      if (blocks.length > 1){ passage = blocks.slice(0, -1).join("\n\n"); text = blocks[blocks.length - 1]; }
      item._header = header;
    }
    item.passage = passage; item.text = text;
    const fb = portalHtml(q.default_feedback || "").text;
    if (fb) item.explanation = fb;
    if (Array.isArray(q.choices) && q.choices.length){
      item.type = q.multiple_selections ? "multi" : "single";
      const parsed = q.choices.map(c => portalHtml(c.text));
      item.options = parsed.map(c => c.text);
      if (parsed.some(c => c.images.length)) item.optionImages = parsed.map(c => c.images);
      let ans = q.choices.map((c, k) => Number(c.score) > 0 ? k : -1).filter(k => k >= 0);
      if (!ans.length && Number(data.score) === 100 && saved[r.instance] && Array.isArray(saved[r.instance].selected)){
        ans = saved[r.instance].selected.map(id => q.choices.findIndex(c => String(c.id) === String(id))).filter(k => k >= 0);
      }
      item.answer = ans.length ? ans : null;
      if (ans.length > 1) item.type = "multi";
    } else if (Array.isArray(q.graders) && q.graders.length){
      item.type = "numeric";
      const g = q.graders.find(g => Number(g.score) > 0) || q.graders[0];
      const resp = String(g.response || "").trim();
      const nums = resp.match(/-?\d*\.?\d+(?:e-?\d+)?/gi) || [];
      if (/range/i.test(g.matcher || "") && nums.length >= 2){ const lo = +nums[0], hi = +nums[1]; item.answer = +((lo + hi) / 2).toPrecision(12); item.tolerance = +(Math.abs(hi - lo) / 2).toPrecision(12); }
      else if (nums.length){ item.answer = +nums[0]; }
      else if (resp){ item.type = "text"; }
      else item.answer = null;
      if (item.type === "text"){ skipped++; return; }
    } else { skipped++; return; }
    item._pos = i + 1;
    item._ctx = r.ctx;
    out.push(item);
  });
  // carry shared paragraphs to the follow-up questions they cover; keep them as a linked set
  for (const lead of out.filter(x => x._header)){
    const { a, b } = lead._header;
    const setId = "set-" + lead.id;
    const ctx = lead.passage ? lead.passage + (lead.passage ? "\n\n" : "") : "";
    for (const x of out){
      if (x._pos < a || x._pos > b) continue;
      x.set = setId; x.seq = x._pos;
      if (x === lead) continue;
      if (!x.passage){
        x.passage = (ctx + `Earlier in this set (Q${lead._pos}): ` + lead.text).trim();
        if (!x.images.length) x.images = lead.images.slice();
      }
    }
  }
  // attach section / content-block context
  const ctxCount = {};
  for (const x of out) if (x._ctx) ctxCount[x._ctx.id] = (ctxCount[x._ctx.id] || 0) + 1;
  for (const x of out){
    const c = x._ctx; if (!c) continue;
    if (c.text && !(x.passage || "").includes(c.text)) x.passage = x.passage ? c.text + "\n\n" + x.passage : c.text;
    const imgs = c.images.filter(u => !x.images.includes(u));
    if (imgs.length) x.passageImages = imgs;
    if (!x.set && ctxCount[c.id] > 1){ x.set = c.id + "-" + data.id; x.seq = x._pos; }
  }
  out.forEach(x => { delete x._header; delete x._pos; delete x._ctx; if (!x.images.length) delete x.images; });
  return { title, group, questions: out, skipped };
}
function portalExtractAll(v){
  // a single assessment response, an array of them, or a HAR export
  const found = [];
  const seen = new Set();
  const take = d => { if (isPortalAssessment(d)){ const key = d.id + "|" + d.title; if (!seen.has(key)){ seen.add(key); found.push(portalConvert(d)); } } };
  if (v && v.log && Array.isArray(v.log.entries)){
    for (const e of v.log.entries){
      const c = e.response && e.response.content; if (!c || !c.text) continue;
      let t = c.text;
      if (c.encoding === "base64"){ try { t = decodeURIComponent(escape(atob(t))); } catch(err){ continue; } }
      if (t.indexOf('"sections"') < 0) continue;
      try { take(JSON.parse(t)); } catch(err){}
    }
  } else if (Array.isArray(v)) v.forEach(take);
  else take(v);
  return found;
}

/* ---------- embedded pictures: data: URLs become small "drill-fig:" references ---------- */
const isFigRef = u => /^https:\/\//i.test(u) || /^drill-fig:[a-z0-9]+$/i.test(u);
function figHash(str){ let h1 = 0x811c9dc5, h2 = 0; for (let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = (h2 * 31 + c) >>> 0; } return h1.toString(36) + h2.toString(36) + str.length.toString(36); }
async function storeEmbedded(dataUrl){
  const ref = "drill-fig:" + figHash(dataUrl);
  if (!figURLs.has(ref)){
    figURLs.set(ref, dataUrl);
    let ok = false;
    try { ok = await figStore.put(ref, await dataURLToBlob(dataUrl)); } catch(e){}
    if (!ok){ try { localStorage.setItem(figKey(ref), dataUrl); } catch(e){} }
  }
  return ref;
}
async function internalizeFigures(qs){
  // swap any embedded data: pictures for references, keeping the pictures in the figure store
  for (const q of qs){
    if (!q || typeof q !== "object") continue;
    for (const key of ["images", "passageImages"]) if (Array.isArray(q[key])) for (let i = 0; i < q[key].length; i++) if (/^data:image\//i.test(q[key][i])) q[key][i] = await storeEmbedded(q[key][i]);
    if (Array.isArray(q.optionImages)) for (const arr of q.optionImages) if (Array.isArray(arr)) for (let i = 0; i < arr.length; i++) if (/^data:image\//i.test(arr[i])) arr[i] = await storeEmbedded(arr[i]);
  }
}
const figRefsOf = qs => { const set = new Set(); for (const q of qs){ (q.images || []).forEach(u => set.add(u)); (q.passageImages || []).forEach(u => set.add(u)); (q.optionImages || []).forEach(a => (a || []).forEach(u => set.add(u))); } return [...set]; };
async function collectFigures(qs, onlyEmbedded){
  const out = {};
  for (const u of figRefsOf(qs)){
    if (onlyEmbedded && !u.startsWith("drill-fig:")) continue;
    const d = await cachedFig(u);
    if (d) out[u] = d;
  }
  return out;
}
async function absorbFigures(figs){
  for (const [u, d] of Object.entries(figs || {})){
    if (!isFigRef(u) || !/^data:image\//i.test(String(d)) || figURLs.has(u)) continue;
    if (await figStore.get(u)) continue;
    figURLs.set(u, d);
    let ok = false;
    try { ok = await figStore.put(u, await dataURLToBlob(d)); } catch(e){}
    if (!ok){ try { localStorage.setItem(figKey(u), d); } catch(e){} }
  }
}

/* ---------- question helpers ---------- */
function validQ(q){
  if (!q || typeof q !== "object" || !String(q.text||"").trim()) return null;
  const type = ["single","multi","numeric"].includes(q.type) ? q.type : (Array.isArray(q.options) && q.options.length ? "single" : "numeric");
  const out = {
    id: q.id ? String(q.id) : uid(), type,
    group: String(q.group || "").trim(),
    passage: String(q.passage || "").trim(),
    text: String(q.text).trim(),
    explanation: String(q.explanation || "").trim(),
  };
  if (Array.isArray(q.images)){ const im = q.images.map(String).filter(isFigRef).slice(0, 8); if (im.length) out.images = im; }
  if (q.set){ out.set = String(q.set); out.seq = Number(q.seq) || 0; }
  if (q.imagesBelow && out.images) out.imagesBelow = true;
  if (out.imagesBelow && typeof q.textAfter === "string" && q.textAfter && out.text.endsWith(q.textAfter.trim()) && q.textAfter.trim().length < out.text.length) out.textAfter = q.textAfter.trim();
  if (Array.isArray(q.passageImages)){ const pi = q.passageImages.map(String).filter(isFigRef).slice(0, 8); if (pi.length) out.passageImages = pi; }
  if (q.source) out.source = String(q.source);
  if (Number(q.addedAt) > 0) out.addedAt = Number(q.addedAt);
  if (q.assess) out.assess = String(q.assess).slice(0, 40);
  if (type === "numeric"){
    const a = Number(q.answer);
    out.answer = q.answer === null || q.answer === undefined || q.answer === "" || !isFinite(a) ? null : a;
    out.tolerance = isFinite(Number(q.tolerance)) && q.tolerance !== null && q.tolerance !== "" ? Math.abs(Number(q.tolerance)) : null;
  } else {
    const oi = Array.isArray(q.optionImages) ? q.optionImages : [];
    const pairs = (q.options||[]).map((o, i) => ({ t: String(o == null ? "" : o).trim().replace(/^\(blank option\)$/, ""),
      im: (Array.isArray(oi[i]) ? oi[i] : []).map(String).filter(isFigRef).slice(0, 4) }));
    if (pairs.length < 2 || pairs.every(x => !x.t && !x.im.length)) return null;
    out.options = pairs.map(x => x.t);
    if (pairs.some(x => x.im.length)) out.optionImages = pairs.map(x => x.im);
    let ans = q.answer;
    if (ans === null || ans === undefined) out.answer = null;
    else {
      ans = Array.isArray(ans) ? ans : [ans];
      const idx = ans.map(a => typeof a === "string" && /^[A-Za-z]$/.test(a) ? LETTERS.indexOf(a.toUpperCase()) : Number(a))
                     .filter(i => Number.isInteger(i) && i >= 0 && i < out.options.length);
      out.answer = idx.length ? [...new Set(idx)].sort((a,b)=>a-b) : null;
      if (out.answer && out.answer.length > 1) out.type = "multi";
    }
  }
  return out;
}
function splitText(q){
  if (q.imagesBelow && q.images && q.textAfter && q.text.endsWith(q.textAfter) && q.textAfter.length < q.text.length)
    return [q.text.slice(0, q.text.length - q.textAfter.length).trim(), q.textAfter];
  return [q.text, ""];
}
const optNorm = o => norm(o).replace(/^\(blank option\)$/, "");
const fingerprint = q => norm(q.passage) + "|" + norm(q.text) + "|" + (q.options||[]).map(optNorm).join("#");
const optImgs = (q, i) => (q.optionImages && q.optionImages[i]) || [];
const optText = (q, i) => q.options[i] || (optImgs(q, i).length ? "(image)" : "");
function isCorrect(q, resp){
  if (resp == null) return false;
  if (q.type === "numeric"){
    if (q.answer == null || resp === "" || !isFinite(Number(resp))) return false;
    const tol = q.tolerance != null ? q.tolerance : Math.max(0.01, Math.abs(q.answer) * 0.01);
    return Math.abs(Number(resp) - q.answer) <= tol + 1e-12;
  }
  if (!q.answer) return false;
  const a = [...resp].sort((x,y)=>x-y);
  return a.length === q.answer.length && a.every((v,i)=>v===q.answer[i]);
}
const hasKey = q => q.answer != null;
const answered = (q, r) => q.type === "numeric" ? (r != null && String(r).trim() !== "") : (r && r.length > 0);

/* ---------- subjects and weeks ---------- */
const NO_WEEK = "No week";
const weekName = q => q.group || "";
function weekSort(a, b){
  if (!a) return 1; if (!b) return -1;
  const na = a.match(/\d+/), nb = b.match(/\d+/);
  if (na && nb && +na[0] !== +nb[0]) return +na[0] - +nb[0];
  return a.localeCompare(b, undefined, { numeric:true });
}
// assignment type within a week: Graded, Practice, or whatever the title says ("Activity Questions")
function assessFromTitle(t){
  t = String(t || "").trim(); if (!t) return "";
  if (/practice/i.test(t)) return "Practice";
  if (/graded/i.test(t)) return "Graded";
  return t.replace(/^week\s*\d+\s*[-–:]?\s*/i, "").replace(/\s*\d+\s*$/, "").trim().slice(0, 40);
}
const typeOf = q => q.assess || assessFromTitle(q.source) || "General";
const TYPE_ORDER = ["Graded", "Practice"];
function typeSort(a, b){ const ia = TYPE_ORDER.indexOf(a), ib = TYPE_ORDER.indexOf(b); if (ia !== ib) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); return a.localeCompare(b); }
function typesOf(qs){
  const m = new Map();
  for (const q of qs){ const t = typeOf(q); if (!m.has(t)) m.set(t, []); m.get(t).push(q); }
  return [...m.keys()].sort(typeSort).map(t => ({ name:t, questions:m.get(t) }));
}
const typeLabel = t => t === "Graded" ? "Graded assignment" : t === "Practice" ? "Practice assignment" : t;
function weeksOf(b){
  const m = new Map();
  for (const q of b.questions){ const w = weekName(q); if (!m.has(w)) m.set(w, []); m.get(w).push(q); }
  return [...m.keys()].sort(weekSort).map(w => ({ name:w, questions:m.get(w) }));
}
function tally(bankId, qs){
  const st = (S.stats[bankId] && S.stats[bankId].q) || {};
  let tried = 0, right = 0;
  for (const q of qs){ const s = st[q.id]; if (s && s.seen){ tried++; if (s.lastRight) right++; } }
  return { tried, right, total: qs.length };
}
const sortedSubjects = () => Object.keys(S.banks).sort((a,b)=>S.banks[a].name.localeCompare(S.banks[b].name));

/* ---------- figures (with a local copy kept in IndexedDB) ---------- */
const figStore = {
  db: null,
  open(){
    if (this.db) return this.db;
    this.db = new Promise((res) => {
      try {
        const r = indexedDB.open("drill-figures", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("figs");
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch(e){ res(null); }
    });
    return this.db;
  },
  async get(url){ const db = await this.open(); if (!db) return null;
    return new Promise(res => { try { const q = db.transaction("figs").objectStore("figs").get(url); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch(e){ res(null); } }); },
  async put(url, blob){ const db = await this.open(); if (!db) return false;
    return new Promise(res => { try { const t = db.transaction("figs", "readwrite"); t.objectStore("figs").put(blob, url); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch(e){ res(false); } }); },
};
const figURLs = new Map();
const figKey = url => "drill:fig:" + url;
async function cachedFig(url){
  if (figURLs.has(url)) return figURLs.get(url);
  let d = null;
  const blob = await figStore.get(url);
  if (blob) { try { d = await blobToDataURL(blob); } catch(e){} }
  if (!d) { try { d = localStorage.getItem(figKey(url)); } catch(e){} }
  if (d) figURLs.set(url, d);
  return d;
}
async function shrinkToDataURL(blob){
  // keep copies small: at most 1400px wide, re-encoded
  const raw = await blobToDataURL(blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = raw; });
    const scale = Math.min(1, 1400 / img.naturalWidth);
    if (scale === 1 && raw.length < 400000) return raw;
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const out = c.toDataURL("image/webp", 0.85);
    return out.startsWith("data:image/webp") ? out : c.toDataURL("image/jpeg", 0.85);
  } catch(e){ return raw; }
}
async function saveFig(url, blob){
  const d = await shrinkToDataURL(blob);
  let ok = false;
  try { ok = await figStore.put(url, await dataURLToBlob(d)); } catch(e){}
  if (!ok){ try { localStorage.setItem(figKey(url), d); ok = true; } catch(e){} }
  figURLs.set(url, d);   // show it now even if it couldn't be kept
  return ok;
}
const inPreview = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
function figure(src, label, cls, compact){
  const wrap = h("div", { class:"fig " + (cls || "") });

    const img = h("img", { alt:label });
    if (opts && opts.noRef) img.referrerPolicy = "no-referrer";
    img.addEventListener("error", () => {
      tries++;
      if (tries === 1) return show(src, { noRef:true });                       // retry without a referrer
      if (tries === 2) return show(src + (src.includes("?") ? "&" : "?") + "_=" + Date.now(), {}); // retry bypassing cache
      fallback();
    });
    img.src = url;
    wrap.replaceChildren(img);
  };
  let msg = null;
  const accept = async blob => {
    if (!blob || !/^image\//.test(blob.type)){ if (msg) msg.textContent = "That wasn’t an image. In the other tab, right-click the picture and choose Copy image (not Copy image address)."; return false; }
    const kept = await saveFig(src, blob);
    document.querySelectorAll(".fig").forEach(f => { if (f._src === src) f._reload(); });

      const items = await navigator.clipboard.read();

      if (msg) msg.textContent = "No image on the clipboard. In the other tab, right-click the picture → Copy image, then try again.";
    } catch(e){ if (msg) msg.textContent = "Press Ctrl+V now (this view doesn’t allow the paste button)."; }
  };
  const fallback = () => {
    if (compact && !wrap._expanded){
      wrap.replaceChildren(h("span", { class:"fig-mini" }, `${label} didn’t load. `,
        h("button", { class:"btn ghost small", type:"button", onclick:e => { e.stopPropagation(); wrap._expanded = true; fallback(); } }, "Fix")));
      return;
    }
    const fileIn = h("input", { type:"file", accept:"image/*", class:"hidden", onchange:async e => { const f = e.target.files[0]; if (f) await accept(f); } });
    const zone = h("div", { class:"fig-err", tabindex:"0", role:"group", "aria-label":`${label} didn’t load. Paste the image here.`,
      onpaste: async e => { const f = [...(e.clipboardData && e.clipboardData.files || [])].find(f => /^image\//.test(f.type)); if (f){ e.preventDefault(); e.stopPropagation(); await accept(f); } },
      ondragover: e => { e.preventDefault(); zone.classList.add("over"); }, ondragleave: () => zone.classList.remove("over"),
      ondrop: async e => { e.preventDefault(); zone.classList.remove("over"); const f = [...e.dataTransfer.files].find(f => /^image\//.test(f.type)); if (f) await accept(f); } },
      h("strong", null, `${label} didn’t load here.`),
      src.startsWith("drill-fig:") ? h("p", { class:"small", style:"margin:.3rem 0" }, "This picture was embedded in the portal’s response and isn’t on this device yet. Re-import that week here, or open the Sheet tab and press “Get my data from the Sheet”.") : null,
      inPreview ? h("p", { class:"small", style:"margin:.3rem 0" }, "You’re viewing Drill inside a preview, which blocks outside images. Download drill.html and open it directly in Chrome, and figures load by themselves.") : null,
      h("ol", { class:"fig-steps" },
        h("li", null, /^https:\/\//i.test(src) ? h("a", { href:src, target:"_blank", rel:"noopener noreferrer" }, "Open it in a new tab") : "Open it in a new tab", ", right-click the image → Copy image."),
        h("li", null, "Click this box and press Ctrl+V. ", h("button", { class:"btn ghost small", onclick:e => { e.stopPropagation(); fileIn.click(); } }, "or choose a saved file"))),
      h("div", { class:"row", style:"margin:.2rem 0" }, h("button", { class:"btn small", onclick:e => { e.stopPropagation(); readClipboard(); } }, "Paste copied image")),
      (msg = h("div", { class:"small muted", "aria-live":"polite" }, "Drill keeps its own copy, so you only do this once per figure.")),
      fileIn);
    zone.addEventListener("click", e => { if (e.target.closest("a,button,input")) e.stopPropagation(); zone.focus(); });
    zone.addEventListener("keydown", e => e.stopPropagation());

  wrap._reload();
  return wrap;
}
async function blobToDataURL(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function dataURLToBlob(d){ return (await fetch(d)).blob(); }

/* ---------- Ask AI: a ready-made prompt for any question ---------- */
function aiPrompt(q, o){
  o = o || {};
  const order = o.order || (q.options || []).map((_, i) => i);
  const L = orig => LETTERS[order.indexOf(orig)];
  const optWords = orig => q.options[orig] || `(the picture in option ${L(orig)})`;
  const lines = [];
  const where = [o.subject, q.group, typeOf(q) !== "General" ? typeLabel(typeOf(q)).toLowerCase() : ""].filter(Boolean).join(", ");
  if (o.mode === "hint"){
    lines.push(`I'm practising a question${where ? " from " + where : ""} and I'm stuck. Please help me work it out myself, without telling me the final answer.`,
      "",
      "1. Name the key concepts and formulas this question is testing, and explain each one from the basics in simple words.",
      "2. Give me a step-by-step plan for solving it, and walk me through the first step only.",
      "3. Ask me what I get for the next step, so I can try it myself.",
      "Do not reveal which option is correct unless I ask.");
  } else {
    lines.push(`Please explain this question${where ? " from " + where : ""} to me step by step, starting from the basics.`,
      "",
      "1. First, name the key concepts and formulas the question tests, and explain each one simply, as if I'm seeing it for the first time.",
      "2. Then solve it step by step, showing every calculation and the reasoning behind each step.",
      q.type === "numeric" ? "3. Show how to check the final value, and point out where people usually slip up in the calculation." : "3. Explain why the correct answer is right, and why each of the other options is wrong.",
      "4. Finish with a short summary of what to remember, and one common mistake to avoid.");
  }
  lines.push("", "Math is written in LaTeX, e.g. \\(x^2\\).", "");
  const figs = [];
  const fig = (u, label) => /^https:\/\//i.test(u) ? figs.push(`${label}: ${u}`) : figs.push(`${label}: (an image I can't link here; ask me to describe it if you need it)`);
  if (q.passage || q.passageImages){
    lines.push("Shared information (applies to this and related questions):", q.passage || "", "");
    (q.passageImages || []).forEach((u, k) => fig(u, `Shared figure ${k+1}`));
  }
  (q.images || []).forEach((u, k) => fig(u, `Figure ${k+1}`));
  lines.push("Question:", q.text, "");
  if (q.type === "numeric") lines.push("This is a numeric-answer question.");
  else {
    lines.push(q.type === "multi" ? "Options (more than one can be correct):" : "Options:");
    order.forEach((orig, pos) => {
      const imgs = optImgs(q, orig);
      lines.push(`${LETTERS[pos]}. ${q.options[orig] || ""}`.trim() + (imgs.length ? (q.options[orig] ? " " : " ") + imgs.map((u, k) => /^https:\/\//i.test(u) ? `[image: ${u}]` : "[image I can't link]").join(" ") : ""));
    });
  }
  if (figs.length) lines.push("", "Figures: I’ll paste them as one picture, labelled the same way (Figure 1, Option A, …). Links in case you can open them:", ...figs);
  if (o.mode !== "hint"){
    if (hasKey(q)) lines.push("", "Correct answer (from the answer key): " + (q.type === "numeric" ? String(q.answer) + (q.tolerance ? ` (accepted range ±${q.tolerance})` : "") : q.answer.map(a => `${L(a)}. ${optWords(a)}`).join("; ")));
    if (o.resp != null && answered(q, o.resp)){
      const mine = q.type === "numeric" ? String(o.resp) : o.resp.map(a => `${L(a)}. ${optWords(a)}`).join("; ");
      const right = hasKey(q) && isCorrect(q, o.resp);
      lines.push("My answer: " + mine + (hasKey(q) ? (right ? " (I got it right, but I want to understand it properly.)" : " (wrong). Please also explain where my reasoning probably went wrong.") : ""));
    }
  }
  return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
// every picture a question uses, labelled the same way as the prompt
function aiPictures(q, order){
  order = order || (q.options || []).map((_, i) => i);
  const list = [];
  (q.passageImages || []).forEach((u, k) => list.push({ label: `Shared figure ${k+1}`, src: u }));
  (q.images || []).forEach((u, k) => list.push({ label: `Figure ${k+1}`, src: u }));
  if (q.type !== "numeric") order.forEach((orig, pos) => optImgs(q, orig).forEach((u, k, arr) => list.push({ label: `Option ${LETTERS[pos]}` + (arr.length > 1 ? ` (${k+1})` : ""), src: u })));
  return list;
}
function loadForCanvas(src){
  return new Promise(async (res, rej) => {
    const local = await cachedFig(src);
    const img = new Image();
    if (!local && /^https:\/\//i.test(src)) img.crossOrigin = "anonymous";
    img.onload = () => res(img); img.onerror = () => rej(new Error("load"));
    if (!local && !/^https:\/\//i.test(src)) return rej(new Error("missing"));
    img.src = local || src;
  });
}
async function picturesBlob(list){
  const imgs = [];
  for (const it of list) imgs.push({ label: it.label, img: await loadForCanvas(it.src) });
  const W = 960, pad = 24, labelH = 34, gap = 22, maxW = W - pad * 2;
  const sized = imgs.map(x => { const sc = Math.min(1, maxW / x.img.naturalWidth, 520 / x.img.naturalHeight); return { ...x, w: Math.round(x.img.naturalWidth * sc), h: Math.round(x.img.naturalHeight * sc) }; });
  const H = pad + sized.reduce((n, x) => n + labelH + x.h + gap, 0) + pad - gap;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  let y = pad;
  for (const x of sized){
    g.fillStyle = "#111"; g.font = "bold 22px system-ui, -apple-system, Segoe UI, sans-serif"; g.textBaseline = "top";
    g.fillText(x.label, pad, y + 4); y += labelH;
    g.drawImage(x.img, pad, y, x.w, x.h);
    g.strokeStyle = "#ccc"; g.lineWidth = 1; g.strokeRect(pad - .5, y - .5, x.w + 1, x.h + 1);
    y += x.h + gap;
  }
  return await new Promise((res, rej) => { try { c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/png"); } catch(e){ rej(e); } });
}

  }
}
function copyTextNow(t){
  // must be called directly inside the tap handler (phones are strict about this)
  const legacy = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
      document.body.append(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch(e){ return false; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(t).then(() => true, () => legacy());
  }
  return Promise.resolve(legacy());
}
async function copyText(t){ return copyTextNow(t); }

/* ---------- read-only question card for browsing ---------- */
function qCard(q, n, showKey, onRemove, subject){
  const li = h("li", { class:"qcard" });
  const head = h("div", { class:"row qc-head" }, h("span", { class:"tag" }, "Q" + n),
    q.set ? h("span", { class:"small muted" }, "Linked set") : null,
    !hasKey(q) ? h("span", { class:"small muted" }, "No answer key") : null,
    h("span", { class:"spacer" }),
    onRemove ? h("button", { class:"btn ghost danger small", "aria-label":`Remove question ${n}`, onclick:onRemove }, "Remove") : null);
  li.append(head);
  if (q.passage || q.passageImages) li.append(h("details", { class:"qc-passage" }, h("summary", null, "Shared paragraph"), h("div", null, q.passage || null),
    (q.passageImages || []).map((src, k) => figure(src, `Shared figure ${k+1}`, "qc-img"))));
  const figs = (q.images || []).map((src, k) => figure(src, `Figure ${k+1}`, "qc-img"));
  const [tB, tA] = splitText(q);
  if (!q.imagesBelow) figs.forEach(f => li.append(f));
  li.append(h("div", { class:"qc-text" }, tB));
  if (q.imagesBelow) figs.forEach(f => li.append(f));
  if (tA) li.append(h("div", { class:"qc-text" }, tA));
  if (q.type === "numeric"){
    li.append(h("div", { class:"small muted" }, "Numeric answer" + (showKey && hasKey(q) ? `: ${q.answer}` + (q.tolerance ? ` (±${q.tolerance})` : "") : "")));
  } else {
    const ol = h("ol", { class:"qc-opts" });
    q.options.forEach((o, i) => {
      const right = showKey && hasKey(q) && q.answer.includes(i);
      const imgs = optImgs(q, i);
      ol.append(h("li", { class: right ? "right" : "" }, h("span", { class:"qc-l" }, LETTERS[i]),
        h("span", { class:"qc-otext" }, o || null, imgs.length ? h("span", { class:"qc-oimg" }, imgs.map((u, k) => figure(u, `Option ${LETTERS[i]} picture`, "", true))) : null),
        right ? h("span", { class:"qc-ok" }, "✓ answer") : null));
    });
    li.append(ol);
  }
  if (showKey && q.explanation) li.append(h("div", { class:"small muted", style:"white-space:pre-wrap" }, q.explanation));
  if (subject !== false) li.append(h("div", { class:"aiwrap" }, aiBar(() => aiPrompt(q, { subject: subject || "" }), "Explain with AI", () => aiPictures(q))));
  return li;
}

async function exportBank(b){
  const figures = await collectFigures(b.questions, false);

    catch(e){ if (e && e.code === "dismissed") return; }
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type:"application/json" }));
    a.download = slug(b.name) + ".json"; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    status.textContent = "Downloaded " + slug(b.name) + ".json. Drop it into Add questions to restore.";
  } catch(e){
    try { await navigator.clipboard.writeText(data); status.textContent = "Copied the backup to your clipboard."; }
    catch(e2){ status.textContent = "Couldn’t save or copy here."; }
  }
}

/* ---------- practice setup ---------- */
function openSetup(bankIds, weekKeys, types){
  const all = Object.keys(S.banks);
  const prev = S.setup || {};
  S.setup = {
    banks: new Set(bankIds || (prev.banks && [...prev.banks].filter(id=>S.banks[id]).length ? [...prev.banks].filter(id=>S.banks[id]) : all)),
    groups: weekKeys ? new Set(weekKeys) : null, // null = all weeks
    types: types ? new Set(types) : null,         // null = all assignment types
    count: prev.count || "",
    order: prev.order || "shuffle",
    shuffleOpts: prev.shuffleOpts !== false,
    feedback: prev.feedback || "instant",
    focus: prev.focus || "all",
    keepSets: prev.keepSets !== false,
  };
  go("setup");
}
function poolFor(st){
  const pool = [];
  for (const id of st.banks){
    const b = S.banks[id]; if (!b) continue;
    const stats = (S.stats[id] && S.stats[id].q) || {};
    for (const q of b.questions){
      if (st.groups && !st.groups.has(id + "::" + (q.group || ""))) continue;
      if (st.types && !st.types.has(typeOf(q))) continue;
      const s = stats[q.id];
      if (st.focus === "missed" && !(s && s.seen && !s.lastRight)) continue;
      if (st.focus === "unseen" && s && s.seen) continue;
      pool.push({ bankId:id, q });
    }
  }
  return pool;
}

    h("button", { class:"btn primary", disabled: !pool.length, onclick:()=>startSession(poolFor(st), st) }, pool.length ? `Start ${Math.min(pool.length, Number(st.count)||pool.length)} questions` : "No questions match"),
  ));
  return root;
}
function buildItem(entry, shuffleOpts){
  const q = entry.q;
  let order = null;
  if (q.type !== "numeric"){
    const idx = q.options.map((_,i)=>i);
    // True/False and Yes/No keep their order; anything else shuffles
    const fixedPair = idx.filter(i => FIXED_PAIR.test((q.options[i] || "").trim()));
    if (shuffleOpts && fixedPair.length >= 2){
      const rest = idx.filter(i => !fixedPair.includes(i));
      order = fixedPair.concat(rest);
    } else if (shuffleOpts){
      const anchored = idx.filter(i => ANCHOR.test(q.options[i]));
      const free = idx.filter(i => !ANCHOR.test(q.options[i]));
      order = shuffle(free).concat(anchored);
    } else order = idx;
  }
  return { bankId: entry.bankId, q, order, resp: q.type === "numeric" ? "" : [], checked:false };
}
function startSession(pool, st){
  let list;
  if (st.order !== "shuffle") list = pool;
  else if (!st.keepSets) list = shuffle(pool);
  else {
    const units = new Map();
    for (const e of pool){ const k = e.q.set ? e.bankId + "|" + e.q.set : "solo|" + e.bankId + "|" + e.q.id; if (!units.has(k)) units.set(k, []); units.get(k).push(e); }
    list = shuffle([...units.values()]).flatMap(u => u.sort((a, b) => (a.q.seq || 0) - (b.q.seq || 0)));
  }
  const n = Math.min(list.length, Number(st.count) || list.length);
  list = list.slice(0, n);
  S.session = { items: list.map(e => buildItem(e, st.shuffleOpts)), idx: 0, mode: st.feedback, started: Date.now(), finished:false, settings: st };
  go("quiz");
}

/* ---------- quiz ---------- */
function recordStat(item){
  const st = S.stats[item.bankId] || (S.stats[item.bankId] = { kind:"stats", bankId:item.bankId, q:{} });
  st.q = st.q || {};
  const s = st.q[item.q.id] || { seen:0, right:0 };
  if (hasKey(item.q)){
    const ok = isCorrect(item.q, item.resp);
    s.seen++; if (ok) s.right++; s.lastRight = ok; s.last = Date.now();
    st.q[item.q.id] = s;
    store.saveStats(item.bankId);
  }
}

function goTo(i){

}
function nextOpen(ss, from){

  return -1;
}
function pick(orig){

  if (ss.mode === "instant" && item.checked) return;
  if (item.q.type === "multi") item.resp = item.resp.includes(orig) ? item.resp.filter(x=>x!==orig) : item.resp.concat(orig);
  else item.resp = [orig];

}
function primaryAction(){
  const ss = S.session; if (!ss || S.view !== "quiz") return;

    if (!item.checked){ if (!answered(item.q, item.resp)) return; item.checked = true; recordStat(item); render(); return; }
    if (ss.idx === ss.items.length-1){ const j = nextOpen(ss, ss.idx); if (j >= 0) return goTo(j); return finish(); }

}
function saveAsKey(item){

function finish(){
  const ss = S.session;

      ? `${untouched} question${untouched===1?" is":"s are"} unanswered and will count as wrong. Submit anyway?`
      : `${untouched} question${untouched===1?" hasn’t":"s haven’t"} been attempted. They’ll be listed as skipped and won’t count. End the session?`)) return;
  if (ss.mode === "exam") ss.items.forEach(it => { if (!it.checked){ it.checked = true; recordStat(it); } });
  else ss.items.forEach(it => { if (!it.checked && answered(it.q, it.resp)){ it.checked = true; recordStat(it); } });

document.addEventListener("keydown", e => {
  if (S.view !== "quiz" || !S.session) return;
  if (e.target.matches("input,textarea,select")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const item = S.session.items[S.session.idx];
  if (e.key === "Enter"){ e.preventDefault(); primaryAction(); return; }
  if (e.key === "ArrowLeft"){ e.preventDefault(); goTo(S.session.idx - 1); return; }
  if (e.key === "ArrowRight"){ e.preventDefault(); goTo(S.session.idx + 1); return; }
  if (item.q.type === "numeric") return;
  let pos = -1;
  if (/^[1-9]$/.test(e.key)) pos = Number(e.key) - 1;
  else if (/^[a-z]$/i.test(e.key)) pos = LETTERS.indexOf(e.key.toUpperCase());

function recordSession(ss){

    ok: hasKey(it.q) ? isCorrect(it.q, it.resp) : null,
    answered: answered(it.q, it.resp), checked: !!it.checked

  if (!items.length) return null;
  const subjects = [...new Set(ss.items.map(i => S.banks[i.bankId] ? S.banks[i.bankId].name : "Deleted subject"))];
  const weeks = [...new Set(ss.items.map(i => (S.banks[i.bankId] ? S.banks[i.bankId].name : "") + ": " + (weekName(i.q) || NO_WEEK) + (typeOf(i.q) !== "General" ? " " + typeOf(i.q) : "")))].sort(weekSort);
  const keyed = items.filter(x => x.ok !== null);
  const rec = {
    id: "s" + Date.now().toString(36) + uid().slice(0,3), at: ss.started, ended: ss.ended || Date.now(),
    mode: ss.mode, subjects, weeks, total: items.length,
    answered: items.filter(x => x.answered).length, keyed: keyed.length, right: keyed.filter(x => x.ok).length, items

}

const SHEET_CFG = "drill:sheet", SHEET_QUEUE = "drill:sheetQueue";
const sheet = {

  saveCfg(){ try { localStorage.setItem(SHEET_CFG, JSON.stringify(this.cfg)); } catch(e){} },
  queue(){ try { return JSON.parse(localStorage.getItem(SHEET_QUEUE) || "[]"); } catch(e){ return []; } },
  setQueue(q){ try { localStorage.setItem(SHEET_QUEUE, JSON.stringify(q.slice(-200))); } catch(e){} },

    }
    const text = await res.text();
    let j; try { j = JSON.parse(text); } catch(e){ throw new Error(/<html/i.test(text) ? "The Sheet answered with a web page, not data. Check the web app is deployed with access set to “Anyone”." : "Unexpected reply from the Sheet."); }

  scheduleBackup(){

  },
  async backup(quiet){
    if (!this.on) return false;
    if (!Object.keys(S.banks).length && !(S.history || []).length){ if (!quiet) this.status = "Nothing here to back up yet. Use “Get my data from the Sheet” first."; if (S.view === "sheet") render(); return false; }
    try {
      await this.flush();
      const st = this.state();
      try { st.figures = await collectFigures(Object.values(S.banks).flatMap(b => b.questions), true); } catch(e){}
      await this.call({ action:"saveState", state: st });
      this.cfg.lastBackup = Date.now(); this.cfg.lastError = ""; this.saveCfg();
      if (!quiet) this.status = "Backed up to your Sheet.";
      return true;
    } catch(e){
      this.cfg.lastError = e.message || "Couldn’t reach the Sheet."; this.saveCfg();
      if (!quiet) this.status = this.cfg.lastError;
      return false;
    } finally { if (S.view === "sheet") render(); }
  },
  async logSession(rec){
    if (!this.on) return;
    const rows = rec.items.map((it, i) => {
      const q = findQ(it.bankId, it.qid); const b = S.banks[it.bankId];
      return { n: i + 1, subject: b ? b.name : "", week: q ? weekName(q) : "", question: q ? q.text.replace(/\s+/g, " ").slice(0, 300) : "(removed)",
        yours: q ? respLabel(q, it.resp) : "", correct: q ? keyLabel(q) : "", result: it.ok === null ? (it.answered ? "No key" : "Skipped") : it.ok ? "Right" : (it.answered ? "Wrong" : "Skipped") };
    });
    const session = { id: rec.id, date: new Date(rec.at).toISOString(), subjects: rec.subjects.join(", "), weeks: rec.weeks.join(", "), mode: rec.mode === "exam" ? "Exam" : "Practice",
      questions: rec.total, answered: rec.answered, right: rec.right, checked: rec.keyed, percent: pctOf(rec.right, rec.keyed), minutes: Math.round((rec.ended - rec.at) / 6000) / 10 };
    const q = this.queue(); q.push({ action:"logSession", session, answers: rows }); this.setQueue(q);
    await this.flush();
    this.scheduleBackup();
  },
  async flush(){
    if (!this.on || this.busy) return;
    this.busy = true;
    try {
      let q = this.queue();
      while (q.length){
        await this.call(q[0]);
        q = this.queue(); q.shift(); this.setQueue(q);
      }
    } catch(e){ this.cfg.lastError = e.message || "Couldn’t reach the Sheet."; this.saveCfg(); }
    finally { this.busy = false; }
  },
  async restore(){
    const j = await this.call({ action:"load" }, "GET");
    if (!j.state || !j.state.banks) throw new Error("The Sheet has no backup yet.");
    return j.state;
  }
};

function sheetScript(token){
  return `// Drill sync for Google Sheets. Paste into Extensions → Apps Script, then Deploy → New deployment → Web app.
const KEY = '${token}';

function doGet(e) { return handle_(e.parameter || {}); }
function doPost(e) {
  let body = {};
  try { body = JSON.parse(e.postData.contents); } catch (err) {}
  return handle_(body);
}

function handle_(p) {
  if (p.token !== KEY) return out_({ ok: false, error: 'bad token' });
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    if (p.action === 'ping') return out_({ ok: true, name: ss.getName() });
    if (p.action === 'saveState') { saveState_(ss, p.state); return out_({ ok: true }); }
    if (p.action === 'load') return out_({ ok: true, state: loadState_(ss) });
    if (p.action === 'logSession') { logSession_(ss, p.session, p.answers || []); return out_({ ok: true }); }
    return out_({ ok: false, error: 'unknown action' });
  } finally { lock.releaseLock(); }
}

function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

function tab_(ss, name, header) {
  let sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    if (header) { sh.getRange(1, 1, 1, header.length).setValues([header]).setFontWeight('bold'); sh.setFrozenRows(1); }
  }
  return sh;
}

function logSession_(ss, s, answers) {
  const sessions = tab_(ss, 'Sessions', ['Session', 'Date', 'Subjects', 'Weeks', 'Mode', 'Questions', 'Answered', 'Right', 'Checked', 'Percent', 'Minutes']);
  if (sessions.getLastRow() > 1 && sessions.getRange(2, 1, sessions.getLastRow() - 1, 1).createTextFinder(s.id).matchEntireCell(true).findNext()) return; // already logged
  sessions.appendRow([s.id, new Date(s.date), s.subjects, s.weeks, s.mode, s.questions, s.answered, s.right, s.checked, s.percent / 100, s.minutes]);
  sessions.getRange(sessions.getLastRow(), 10).setNumberFormat('0%');
  const ans = tab_(ss, 'Answers', ['Session', 'Date', 'Subject', 'Week', '#', 'Question', 'Your answer', 'Correct answer', 'Result']);
  if (answers.length) {
    const rows = answers.map(a => [s.id, new Date(s.date), a.subject, a.week, a.n, a.question, a.yours, a.correct, a.result]);
    ans.getRange(ans.getLastRow() + 1, 1, rows.length, rows[0].length).setValues(rows);
  }
}

function saveState_(ss, state) {
  const json = JSON.stringify(state);
  const size = 45000, parts = [];
  for (let i = 0; i < json.length; i += size) parts.push([parts.length + 1, json.slice(i, i + size)]);
  const data = tab_(ss, 'Backup', ['Part', 'Data (used by Drill to restore, do not edit)']);
  if (data.getLastRow() > 1) data.getRange(2, 1, data.getLastRow() - 1, 2).clearContent();
  data.getRange(2, 1, parts.length, 2).setValues(parts);
  data.getRange(1, 4, 1, 2).setValues([['Last backup', new Date()]]);

  // a readable copy of every question, for browsing in the Sheet
  const qs = tab_(ss, 'Questions', ['Subject', 'Week', '#', 'Question', 'Options', 'Answer', 'Times seen', 'Times right']);
  if (qs.getLastRow() > 1) qs.getRange(2, 1, qs.getLastRow() - 1, 8).clearContent();
  const rows = [];
  Object.keys(state.banks || {}).forEach(id => {
    const b = state.banks[id], st = ((state.stats || {})[id] || {}).q || {};
    (b.questions || []).forEach((q, i) => {
      const opts = (q.options || []).map((o, k) => String.fromCharCode(65 + k) + '. ' + o).join('\\n');
      const ans = q.answer == null ? '' : Array.isArray(q.answer) ? q.answer.map(k => String.fromCharCode(65 + k)).join(', ') : String(q.answer);
      const s = st[q.id] || {};
      rows.push([b.name, q.group || '', i + 1, String(q.text).slice(0, 49000), opts.slice(0, 49000), ans, s.seen || 0, s.right || 0]);
    });
  });
  if (rows.length) qs.getRange(2, 1, rows.length, 8).setValues(rows);
}

function loadState_(ss) {
  const data = ss.getSheetByName('Backup');
  if (!data || data.getLastRow() < 2) return null;
  const parts = data.getRange(2, 1, data.getLastRow() - 1, 2).getValues().filter(r => r[1] !== '').sort((a, b) => a[0] - b[0]);
  return JSON.parse(parts.map(r => r[1]).join(''));
}
`;
}

function mergeState(remote){
  // union of both sides, except anything either side deleted after it was added
  const r = remote || {}; let addedQ = 0, addedS = 0, removedQ = 0;
  if (r.figures) absorbFigures(r.figures).then(() => { if (["manage","quiz","library"].includes(S.view)) render(); });
  const t = tombs(), rt = r.deleted || {};
  let tombChanged = false;
  for (const kind of ["banks", "questions", "sessions"]) for (const [k, ts] of Object.entries(rt[kind] || {})) if ((t[kind][k] || 0) < ts){ t[kind][k] = ts; tombChanged = true; }
  // apply deletions to what's here
  for (const [id, b] of Object.entries(S.banks)){
    if ((t.banks[id] || 0) > (b.createdAt || 0)){ store.dropBank(id); continue; }
    const keep = b.questions.filter(q => !isDeletedQ(id, q));
    if (keep.length !== b.questions.length){ removedQ += b.questions.length - keep.length; b.questions = keep; }
  }
  // bring in what's new from the other side
  for (const [id, rb] of Object.entries(r.banks || {})){
    if ((t.banks[id] || 0) > (rb.createdAt || 0)) continue;
    let lb = S.banks[id];
    if (!lb){ lb = S.banks[id] = Object.assign({}, rb, { questions: [] }); }
    const have = new Set(lb.questions.map(q => q.id));
    for (const q of rb.questions || []) if (!have.has(q.id) && !isDeletedQ(id, q)){ lb.questions.push(q); addedQ++; }
  }
  for (const [id, rs] of Object.entries(r.stats || {})){
    if (!S.banks[id]) continue;
    const ls = S.stats[id] || (S.stats[id] = { kind:"stats", bankId:id, q:{} });
    ls.q = ls.q || {};
    for (const [qid, v] of Object.entries(rs.q || {})){ const mine = ls.q[qid]; if (!mine || (v.seen || 0) > (mine.seen || 0) || ((v.seen||0) === (mine.seen||0) && (v.last||0) > (mine.last||0))) ls.q[qid] = v; }
  }
  const ids = new Set((S.history || []).map(x => x.id));
  for (const hrec of r.history || []) if (!ids.has(hrec.id) && !t.sessions[hrec.id]){ (S.history = S.history || []).push(hrec); addedS++; }
  S.history = (S.history || []).filter(x => !t.sessions[x.id]).sort((a, b) => b.at - a.at).slice(0, HISTORY_MAX);
  for (const bk of Object.values(S.banks)) store.saveBank(bk);
  for (const id of Object.keys(S.stats)) store.saveStats(id);
  store.saveHistory();
  if (tombChanged) store.saveDeleted();
  return { addedQ, addedS, removedQ };
}
async function doRestore(){
  try {
    sheet.status = "Fetching your data from the Sheet…"; render();
    let st = null;
    try { st = await sheet.restore(); } catch(e){ if (/no backup/i.test(e.message)) st = null; else throw e; }
    if (!st){ sheet.status = "The Sheet has no backup yet."; render(); return; }
    const { addedQ, addedS, removedQ } = mergeState(st);
    sheet.status = addedQ || addedS || removedQ ? `Got ${addedQ} question${addedQ===1?"":"s"} and ${addedS} session${addedS===1?"":"s"} from the Sheet` + (removedQ ? `, and removed ${removedQ} that were deleted on another device` : "") + "." : "Already up to date with the Sheet.";
    render();
  } catch(e){ sheet.status = "Couldn’t get your data: " + e.message; render(); }
}

async function readJsonFiles(files){
